# 129787 - António
name: Checkstyle Gate 129787

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Checkstyle via Maven
        run: mvn checkstyle:check -Dcheckstyle.config.location=checkstyle/checkstyle-129787.xml